name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: [10, 11, 12]
        include:
          - laravel: 10
            testbench: 8
          - laravel: 11
            testbench: 9
          - laravel: 12
            testbench: 10
        exclude:
          # Laravel 11 and 12 require PHP 8.2+
          - php: '8.1'
            laravel: 11
          - php: '8.1'
            laravel: 12
          # Laravel 10 is not supported on PHP 8.4
          - php: '8.4'
            laravel: 10

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
