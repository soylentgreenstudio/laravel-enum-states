name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [10, 11, 12]
        include:
          # A floating ^8.0 lets composer settle on testbench 8.0.0 / Laravel 10.0.0;
          # the minor floor keeps this job on the current 10.x line.
          - laravel: 10
            testbench: '^8.35'
          - laravel: 11
            testbench: '^9.0'
          - laravel: 12
            testbench: '^10.0'
        exclude:
          # Laravel 10 is not supported on PHP 8.4
          - php: '8.4'
            laravel: 10

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show resolved versions
        run: composer show laravel/framework orchestra/testbench | grep -E "^(name|versions)"

      - name: Run tests
        run: composer test
